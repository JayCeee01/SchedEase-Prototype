{% extends "base.html" %}
{% block content %}
<section class="auth">
  <p class="eyebrow">Secure Access</p>
  <h1>Sign in to SchedEase</h1>
  <form method="post" class="panel form">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="primary" data-loading-text="Signing in">Sign in</button>
  </form>
</section>
{% endblock %}
